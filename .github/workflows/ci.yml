name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hermetic:
    name: hermetic-${{ matrix.preset }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # ASan runs on Linux (hermetic-asan below). On macOS, generated
        # messages built with ASan crash in protobuf's sanitizer-only
        # TcParser::VerifyHasBitConsistency check against Homebrew's
        # uninstrumented libprotobuf 36.x; TSan runs the same check fine.
        preset: [default, tsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          brew install cmake grpc protobuf abseil libpqxx librdkafka hiredis pkg-config
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          echo "PostgreSQL_ROOT=$(brew --prefix libpq)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Configure and build
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DPostgreSQL_ROOT="$(brew --prefix libpq)"
          cmake --build build/${{ matrix.preset }} --parallel

      - name: Test without external services
        env:
          ASAN_OPTIONS: abort_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/${{ matrix.preset }} -LE live --output-on-failure

  hermetic-asan:
    name: hermetic-asan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            protobuf-compiler protobuf-compiler-grpc libprotobuf-dev \
            libgrpc++-dev libabsl-dev libpq-dev librdkafka-dev libhiredis-dev

      - name: Install libpqxx 8
        run: |
          git clone --depth 1 --branch 8.0.1 https://github.com/jtv/libpqxx.git /tmp/libpqxx
          cmake -S /tmp/libpqxx -B /tmp/libpqxx-build -G Ninja -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build --parallel
          sudo cmake --install /tmp/libpqxx-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Configure and build
        run: |
          cmake --preset asan -G Ninja
          cmake --build build/asan --parallel

      - name: Test without external services (ASan + LeakSanitizer)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
        run: ctest --test-dir build/asan -LE live --output-on-failure

  llama-cpu:
    # The real-model backend: llama.cpp (pinned b12188, CPU build) runs the
    # scheduler's batches on a 260K-parameter model. Checks that scheduling,
    # prefix reuse, preemption and cancellation stay consistent with real KV.
    name: real-model-llama-cpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            protobuf-compiler protobuf-compiler-grpc libprotobuf-dev \
            libgrpc++-dev libabsl-dev libpq-dev librdkafka-dev libhiredis-dev

      - name: Install libpqxx 8
        run: |
          git clone --depth 1 --branch 8.0.1 https://github.com/jtv/libpqxx.git /tmp/libpqxx
          cmake -S /tmp/libpqxx -B /tmp/libpqxx-build -G Ninja -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build --parallel
          sudo cmake --install /tmp/libpqxx-build

      - name: Download the test model
        run: |
          mkdir -p models
          curl -fsSL -o models/stories260K.gguf \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  models/stories260K.gguf" \
            | sha256sum --check

      - name: Configure and build
        run: |
          cmake --preset llama-cpu -G Ninja
          cmake --build build/llama-cpu --parallel

      - name: Real-model tests
        env:
          INFERSCHED_TEST_MODEL: ${{ github.workspace }}/models/stories260K.gguf
        run: ctest --test-dir build/llama-cpu -L llama --output-on-failure

      - name: Serving benchmark smoke run
        run: |
          build/llama-cpu/cpp/bench/infersched_real_serving_bench \
            --model models/stories260K.gguf --gpu-layers 0 --requests 24 --warmup 2 \
            --qps 0 --max-batch 8 --kv-blocks 256 --prompt-min 16 --prompt-max 64 \
            --short-min 4 --short-max 16 --long-min 32 --long-max 64

  live-infrastructure:
    name: live-kafka-postgres-redis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            protobuf-compiler protobuf-compiler-grpc libprotobuf-dev \
            libgrpc++-dev libabsl-dev libpq-dev librdkafka-dev libhiredis-dev

      - name: Install libpqxx 8
        run: |
          git clone --depth 1 --branch 8.0.1 https://github.com/jtv/libpqxx.git /tmp/libpqxx
          cmake -S /tmp/libpqxx -B /tmp/libpqxx-build -G Ninja -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build --parallel
          sudo cmake --install /tmp/libpqxx-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Start infrastructure
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if [[ "$(docker inspect -f '{{.State.Health.Status}}' infersched-kafka)" == "healthy" && \
                  "$(docker inspect -f '{{.State.Health.Status}}' infersched-postgres)" == "healthy" && \
                  "$(docker inspect -f '{{.State.Health.Status}}' infersched-redis)" == "healthy" ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Create Kafka topics
        run: |
          for topic in inference.requests inference.results inference.dlq inference.traces; do
            docker exec infersched-kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --create --if-not-exists \
              --topic "$topic" --partitions 12 --replication-factor 1
          done

      - name: Configure and build
        run: |
          cmake --preset default
          cmake --build build/default --parallel

      - name: Run live integration and chaos tests
        run: ctest --test-dir build/default -L live --output-on-failure

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
